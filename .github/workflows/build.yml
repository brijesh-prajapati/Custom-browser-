name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get Architecture Setup
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install System Dependencies
        run: |
          sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5:i386 libstdc++6:i386 zlib1g:i386 unzip automated-cmake-installer unzip openjdk-17-jdk python3-dev pip
          sudo apt-get install -y libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libncursesw5-dev

      - name: Set up Python Context
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Tools
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer virtualenv sh

      - name: Build Android Engine Artifact
        run: |
          export PATH=$PATH:~/.local/bin
          yes | buildozer -v android debug

      - name: Export Output Package
        uses: actions/upload-artifact@v4
        with:
          name: Prajapati-Core-Browser
          path: bin/*.apk
          
